version: '3.8'

services:
  db:
    image: postgres:16
    container_name: fluxnook-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fluxnook
      POSTGRES_PASSWORD: fluxnook_dev
      POSTGRES_DB: fluxnook_dev
    ports:
      - '5432:5432'
    volumes:
      - fluxnook_pgdata:/var/lib/postgresql/data

volumes:
  fluxnook_pgdata: