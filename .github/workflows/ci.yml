name: CI

on:
    pull_request:
        branches: [develop]
    push:
        branches: [main]

jobs:
    lint-and-check:
        runs-on: ubuntu-latest
        env:
            DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: '20'
            - run: npm install
            - run: npm run lint
            - run: npx tsc --noEmit
            - run: npx prisma validate